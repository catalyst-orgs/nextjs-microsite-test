apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: test-nextjs
  namespace: test-nextjs
  labels:
    app.kubernetes.io/name: test-nextjs
    app.kubernetes.io/managed-by: platform-engineering
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: test-nextjs
  minReplicas: 
  maxReplicas: 
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
